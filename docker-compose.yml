version: '3.8'

services:
  app:
    build: .
    container_name: wise_sports_ai
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - CHROME_BIN=/usr/bin/google-chrome-stable
      - CHROME_PATH=/usr/bin/google-chrome-stable
    networks:
      - app_network

  # nginx:
  #   image: nginx:latest
  #   container_name: nginx_proxy
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Read-only mount
  #   networks:
  #     - app_network

networks:
  app_network:
    driver: bridge