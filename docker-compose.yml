version: '3.8'

services:
  app:
    image: hamzakhanswati/wisesportsai:latest
    container_name: WiseSportsAI
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    volumes:
      - ./Artifacts:/app/Artifacts
    restart: unless-stopped
    network_mode: "host"