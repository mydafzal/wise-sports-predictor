version: '3.8'

services:
  app:
    build: .
    container_name: wise_sports_ai
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - CHROME_BIN=/usr/bin/google-chrome-stable
      - CHROME_PATH=/usr/bin/google-chrome-stable
    networks:
      - app_network


networks:
  app_network:
    driver: bridge